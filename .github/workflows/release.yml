name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Permissions are per job, not workflow-wide: a called workflow inherits
  # the caller's token, and this one installs npm packages - third-party
  # lifecycle scripts have no business holding a token that can push.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Without this, v1.0.0 could ship a package.json saying 0.1.0, and
      # `npx …#v1.0.0` would report the wrong version to whoever asks.
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes

  # Behind release, not beside it: as a sibling this job would push an image
  # for a tag the version gate has just rejected.
  image:
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A hyphen in the tag is semver's prerelease marker (v1.1.0-rc1), and
      # `latest` has to keep pointing at the newest stable image - a release
      # candidate taking it would reach everyone who omits a tag.
      - name: Tags for this build
        id: image_tags
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease tag - :latest stays where it is" ;;
            *) tags="$(printf '%s\n%s' "$tags" "ghcr.io/${GITHUB_REPOSITORY}:latest")" ;;
          esac
          {
            echo 'tags<<TAGS_EOF'
            echo "$tags"
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "$tags"

      # arm64 is not optional: without it the image only runs emulated on
      # an Apple Silicon Mac.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
