name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: tmux -V

      # The route tests start real tmux sessions, and scripts/claude-session.sh
      # runs `claude` in them: without the binary the pane dies at once and
      # every such test waits out its precondition. No token is needed - the
      # tests use an invalid one and only require the process to stay up.
      - run: npm install -g @anthropic-ai/claude-code

      # ttyd is not packaged for Ubuntu, and one integration test starts a
      # real ttyd and talks to it over the base path. The upstream release
      # binary is static, so fetching it is cheaper than building it.
      - run: |
          curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          ttyd --version

      # `tmux set-buffer` does not start a server, it fails without one, and
      # the buffer route test works against the host's shared server the way
      # the real copy feature does. Locally that server is always up; here it
      # has to be created.
      - run: tmux new-session -d -s ci-keepalive

      - run: npm ci

      - run: npm run lint

      # Runs through scripts/run-tests.sh, which keeps --test-concurrency=1.
      # Do not raise it: the suite starts real tmux sessions.
      - run: npm test
