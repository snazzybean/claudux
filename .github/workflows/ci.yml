name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ttyd is never spawned - ttydManager.start() takes an injected
      # spawnFn - so only tmux needs installing here.
      - run: sudo apt-get update && sudo apt-get install -y tmux

      # The route tests start real tmux sessions, and scripts/claude-session.sh
      # runs `claude` in them: without the binary the pane dies at once and
      # every such test waits out its precondition. No token is needed - the
      # tests use an invalid one and only require the process to stay up.
      - run: npm install -g @anthropic-ai/claude-code

      - run: npm ci

      - run: npm run lint

      # Runs through scripts/run-tests.sh, which keeps --test-concurrency=1.
      # Do not raise it: the suite starts real tmux sessions.
      - run: npm test
