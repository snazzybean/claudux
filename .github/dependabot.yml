version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Only the base image. The ttyd binary is fetched by URL and pinned by
  # content hash, which Dependabot does not track - that pin moves by hand,
  # together with the one in ci.yml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The image stays on a Node LTS line, and Dependabot offers whatever tag
    # is newest - which is the Current line for half of every year. That step
    # is taken by hand, once the line it points at has become LTS.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
